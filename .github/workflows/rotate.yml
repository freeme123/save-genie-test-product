name: Rotate price & deploy

on:
  # Rebuild hourly so the served HTML never lags the time-derived price.
  # (Scheduled runs are best-effort and may be delayed a few minutes — fine.)
  schedule:
    - cron: "0 * * * *"
  # Manual / on-demand trigger with a command. Used by trigger.sh and the
  # "Run workflow" button in the Actions tab.
  workflow_dispatch:
    inputs:
      command:
        description: "What to change"
        type: choice
        default: none
        options:
          - none # re-render at current state (clock if no override)
          - drop # lower price by $10
          - raise # raise price by $10
          - toggle_stock # flip in/out of stock
          - set_instock
          - set_outofstock
          - reset # clear overrides, back to automatic clock mode
  # Build on every push to main (e.g. when you change the schedule).
  push:
    branches: [main]

# contents:write lets us persist state.json; pages/id-token for deployment.
permissions:
  contents: write
  pages: write
  id-token: write

# Let a running deploy finish; don't pile up concurrent ones.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Resolves the real Pages URL so JSON-LD/image use absolute URLs.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Generate page
        run: node generate.js
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
          COMMAND: ${{ github.event.inputs.command || 'none' }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      # Persist any manual-override change back to the repo, AFTER deploy so a
      # push race can never block serving the new price. Re-sync onto the latest
      # main and re-apply our state each attempt (last-writer-wins). [skip ci]
      # avoids re-triggering this workflow. Never fails the job.
      - name: Persist state
        continue-on-error: true
        run: |
          if [[ -z "$(git status --porcelain state.json)" ]]; then
            echo "No state change to persist."; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp state.json /tmp/state.json
          for i in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q --hard origin/main          # untracked public/ is preserved
            cp /tmp/state.json state.json
            if git diff --quiet state.json; then
              echo "Remote already matches desired state; nothing to push."; exit 0
            fi
            git add state.json
            git commit -q -m "chore: update product state [skip ci]"
            if git push; then echo "Persisted on attempt $i."; exit 0; fi
            echo "Push rejected (attempt $i) — retrying after re-sync."
            sleep 2
          done
          echo "::warning::Could not persist state.json after 5 attempts (non-fatal; deploy already succeeded)."
