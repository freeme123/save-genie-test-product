name: Rotate price & deploy

on:
  # Rebuild hourly so the served HTML never lags the time-derived price.
  # (Scheduled runs are best-effort and may be delayed a few minutes — fine.)
  schedule:
    - cron: "0 * * * *"
  # Manual / on-demand trigger with a command. Used by trigger.sh and the
  # "Run workflow" button in the Actions tab.
  workflow_dispatch:
    inputs:
      command:
        description: "What to change"
        type: choice
        default: none
        options:
          - none # re-render at current state (clock if no override)
          - drop # lower price by $10
          - raise # raise price by $10
          - toggle_stock # flip in/out of stock
          - set_instock
          - set_outofstock
          - reset # clear overrides, back to automatic clock mode
  # Build on every push to main (e.g. when you change the schedule).
  push:
    branches: [main]

# contents:write lets us persist state.json; pages/id-token for deployment.
permissions:
  contents: write
  pages: write
  id-token: write

# Let a running deploy finish; don't pile up concurrent ones.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Resolves the real Pages URL so JSON-LD/image use absolute URLs.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Generate page
        run: node generate.js
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
          COMMAND: ${{ github.event.inputs.command || 'none' }}

      # Persist any manual-override change back to the repo. [skip ci] avoids
      # re-triggering this workflow (this same run already deploys below).
      - name: Persist state
        run: |
          if [[ -n "$(git status --porcelain state.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "chore: update product state [skip ci]"
            git push
          else
            echo "No state change to persist."
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
